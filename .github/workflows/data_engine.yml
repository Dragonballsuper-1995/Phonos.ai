name: Phonos.ai Daily Data Engine

on:
  schedule:
    # Runs at 02:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt
        playwright install chromium

    - name: Run YouTube ABSA Engine
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        cd apps/api
        python scripts/youtube_engine.py

    # The Reddit Engine step is commented out until the user gets their API key.
    # - name: Run Reddit Knowledge Graph Engine
    #   env:
    #     REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
    #     REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    #     REDDIT_USER_AGENT: "Phonos-ai/1.0"
    #   run: |
    #     cd apps/api
    #     python scripts/reddit_engine.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add apps/api/data/absa_phone_summary.csv
        git commit -m "Auto-update: Daily YouTube ABSA sentiment data" || echo "No changes to commit"
        git push
